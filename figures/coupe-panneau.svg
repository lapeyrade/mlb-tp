<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 208" width="860" height="208" role="img"><title>Collage et décollement entre les couches</title><rect width="860" height="208" rx="14" fill="#f4f7f6"/><g font-family="Arial, sans-serif" fill="#18384b"><text x="24" y="34" font-size="22" font-weight="bold">Un même aspect en surface, deux collages différents</text><g transform="translate(30 0)"><text x="0" y="69" font-size="17">Collage continu</text><rect x="0" y="90" width="375" height="18" fill="#b4c7ba" stroke="#435e63"/><rect x="0" y="108" width="375" height="18" fill="#65858c" stroke="#435e63"/><rect x="0" y="126" width="375" height="18" fill="#b4c7ba" stroke="#435e63"/><text x="0" y="168" font-size="15">Couches solidaires</text></g><g transform="translate(445 0)"><text x="0" y="69" font-size="17">Décollement localisé</text><rect x="0" y="90" width="375" height="18" fill="#b4c7ba" stroke="#435e63"/><rect x="0" y="108" width="375" height="18" fill="#65858c" stroke="#435e63"/><rect x="0" y="126" width="375" height="18" fill="#b4c7ba" stroke="#435e63"/><path d="M140 108 Q189 95 235 108 Q185 114 140 108Z" fill="#fff3d8" stroke="#a03d25" stroke-width="2"/><path d="M189 110l42 51h19" fill="none" stroke="#a03d25" stroke-width="2"/><text x="253" y="168" font-size="15">Zone décollée</text></g><text x="30" y="195" font-size="14">Vue en coupe schématique. Le défaut se situe entre deux couches.</text></g></svg>
