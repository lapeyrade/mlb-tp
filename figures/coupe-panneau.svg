<svg xmlns="http://www.w3.org/2000/svg" width="860" height="208" role="img" viewBox="0 0 860 208"><title>Collage et décollement entre les couches</title><rect width="860" height="208" fill="#f4f7f6" rx="14"/><g fill="#18384b" font-family="Arial, sans-serif"><text x="24" y="34" font-size="22" font-weight="bold">Un même aspect en surface, deux collages différents</text><g transform="translate(30 0)"><text x="0" y="69" font-size="17">Collage continu</text><rect width="375" height="18" x="0" y="90" fill="#b4c7ba" stroke="#435e63"/><rect width="375" height="18" x="0" y="108" fill="#65858c" stroke="#435e63"/><rect width="375" height="18" x="0" y="126" fill="#b4c7ba" stroke="#435e63"/><text x="0" y="168" font-size="15">Couches solidaires</text></g><g transform="translate(445 0)"><text x="0" y="69" font-size="17">Décollement localisé</text><rect width="375" height="18" x="0" y="90" fill="#b4c7ba" stroke="#435e63"/><rect width="375" height="18" x="0" y="108" fill="#65858c" stroke="#435e63"/><rect width="375" height="18" x="0" y="126" fill="#b4c7ba" stroke="#435e63"/><path fill="#fff3d8" stroke="#a03d25" stroke-width="2" d="M140 108 Q189 95 235 108 Q185 114 140 108Z"/><path fill="none" stroke="#a03d25" stroke-width="2" d="M189 110l42 51h19"/><text x="253" y="168" font-size="15">Zone décollée</text></g><text x="30" y="195" font-size="14">Vue en coupe schématique. Le défaut se situe entre deux couches.</text></g></svg>