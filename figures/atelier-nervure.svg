<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 205" width="560" height="205" role="img" aria-labelledby="title desc">
<title id="title">Fabrication d’un panneau sous presse</title>
<desc id="desc">Vue en coupe simplifiée, commune aux lignes A et B. Le plateau supérieur descend sur les couches posées sur le plateau inférieur. Le panneau assemblé sort vers le contrôle qualité.</desc>
