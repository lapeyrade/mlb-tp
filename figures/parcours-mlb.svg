<svg xmlns="http://www.w3.org/2000/svg" width="970" height="474" aria-labelledby="title desc" role="img" viewBox="0 0 970 474"><title id="title">Du lot à inspecter au modèle en production</title><desc id="desc">Cinq chapitres et huit travaux pratiques pour préparer, évaluer et déployer une règle d’inspection.</desc><rect width="970" height="474" fill="#f3f7f8" rx="16"/><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="42" fill="#18344a" font-size="29" font-weight="700">Du lot à inspecter au modèle en production</text><path stroke="#85aaa9" stroke-width="4" d="M58 99v319"/><circle cx="58" cy="98" r="29" fill="#e0eeec" stroke="#a0bfbb"/><g fill="none" stroke="#176d63" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M4 34h11l6-19 8 30 8-22h13" transform="translate(35 75) scale(.85)"/></g><text x="105" y="92" fill="#34655f" font-size="13" font-weight="700">CHAPITRE 1</text><text x="105" y="116" fill="#18344a" font-size="21" font-weight="700">Cadrer le problème</text><text x="434" y="103" fill="#15685f" font-size="16" font-weight="700">TP 01</text><text x="505" y="103" fill="#18344a" font-size="18" font-weight="400">Choisir la cible et les mesures disponibles</text><path stroke="#cedcdd" d="M105 138H939"/><circle cx="58" cy="178" r="29" fill="#e0eeec" stroke="#a0bfbb"/><g fill="none" stroke="#176d63" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" transform="translate(35 155) scale(.85)"><path d="M7 44V10m0 34h41M10 39q8-23 36-27"/><circle cx="25" cy="21" r="4" fill="#fff"/></g><text x="105" y="172" fill="#34655f" font-size="13" font-weight="700">CHAPITRE 2</text><text x="105" y="196" fill="#18344a" font-size="21" font-weight="700">Évaluer la décision</text><text x="434" y="183" fill="#15685f" font-size="16" font-weight="700">TP 02</text><text x="505" y="183" fill="#18344a" font-size="18" font-weight="400">Fixer un seuil selon le coût des erreurs</text><path stroke="#cedcdd" d="M105 218H939"/><circle cx="58" cy="258" r="29" fill="#e0eeec" stroke="#a0bfbb"/><g fill="none" stroke="#176d63" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" transform="translate(35 235) scale(.85)"><path d="M27 10v10M12 31V20h29v11"/><circle cx="27" cy="9" r="4"/><circle cx="12" cy="37" r="5"/><circle cx="41" cy="37" r="5"/></g><text x="105" y="252" fill="#34655f" font-size="13" font-weight="700">CHAPITRE 3</text><text x="105" y="276" fill="#18344a" font-size="21" font-weight="700">Comparer les modèles</text><text x="434" y="249" fill="#15685f" font-size="16" font-weight="700">TP 03</text><text x="505" y="249" fill="#18344a" font-size="18" font-weight="400">Comparer SVM et MLP sur la carte PCA</text><text x="434" y="278" fill="#15685f" font-size="16" font-weight="700">TP 04</text><text x="505" y="278" fill="#18344a" font-size="18" font-weight="400">Comparer arbre, forêt et XGBoost</text><path stroke="#cedcdd" d="M105 298H939"/><circle cx="58" cy="338" r="29" fill="#e0eeec" stroke="#a0bfbb"/><g fill="none" stroke="#176d63" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"><path d="M3 39c12 0 13-26 23-26s10 26 24 26M3 43h47" transform="translate(35 315) scale(.85)"/></g><text x="105" y="332" fill="#34655f" font-size="13" font-weight="700">CHAPITRE 4</text><text x="105" y="356" fill="#18344a" font-size="21" font-weight="700">Raisonner avec l’incertitude</text><text x="434" y="329" fill="#15685f" font-size="16" font-weight="700">TP 05</text><text x="505" y="329" fill="#18344a" font-size="18" font-weight="400">Actualiser le risque et figer le modèle</text><text x="434" y="358" fill="#15685f" font-size="16" font-weight="700">TP 06</text><text x="505" y="358" fill="#18344a" font-size="18" font-weight="400">Suivre un état caché malgré le bruit</text><path stroke="#cedcdd" d="M105 378H939"/><circle cx="58" cy="418" r="29" fill="#e0eeec" stroke="#a0bfbb"/><g fill="none" stroke="#176d63" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" transform="translate(35 395) scale(.85)"><path d="M3 11h13m-13 8h13m-13 8h13m3-8h8v12h8"/><rect width="16" height="14" x="35" y="24" rx="2"/></g><text x="105" y="412" fill="#34655f" font-size="13" font-weight="700">CHAPITRE 5</text><text x="105" y="436" fill="#18344a" font-size="21" font-weight="700">Passer en production</text><text x="434" y="409" fill="#15685f" font-size="16" font-weight="700">TP 07</text><text x="505" y="409" fill="#18344a" font-size="18" font-weight="400">Déployer avec Spark en batch et en flux</text><text x="434" y="438" fill="#15685f" font-size="16" font-weight="700">TP 08</text><text x="505" y="438" fill="#18344a" font-size="18" font-weight="400">Surveiller et évaluer sur les lots réservés</text></g></svg>